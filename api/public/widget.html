<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat</title>
  <style>
    * { box-sizing: border-box; }
    :root { --ink: #14142b; --muted: #5b5b7a; --line: #e6e6f0; --accent: #4338ca; }
    html, body { height: 100%; }
    body {
      margin: 0; display: flex; flex-direction: column; height: 100vh; background: #fff; color: var(--ink);
      font-family: "Inter Tight", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; line-height: 1.45;
    }
    header { display: flex; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--line); font-weight: 800; font-size: 17px; letter-spacing: -0.03em; }
    #log { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; max-width: 86%; font-size: 15px; }
    .you { background: var(--accent); color: #fff; margin-left: auto; border-bottom-right-radius: 6px; }
    .bot { background: #f1f1f8; border-bottom-left-radius: 6px; }
    #form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); align-items: center; }
    input {
      flex: 1; min-width: 0; padding: 11px 16px; border: 1px solid #d4d4e4; border-radius: 999px;
      font: inherit; font-size: 15px; color: var(--ink);
    }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, #fff); }
    button {
      padding: 11px 18px; border: 0; border-radius: 999px; background: var(--accent); color: #fff;
      font: inherit; font-weight: 650; font-size: 15px; cursor: pointer;
    }
    button:hover { filter: brightness(.92); }
    button:disabled { opacity: .55; cursor: default; }

    /* Design: Bold. Solid header, squarer corners, larger text. */
    body.theme-bold header { background: var(--accent); color: #fff; border-bottom: 0; padding: 20px; font-size: 19px; }
    body.theme-bold .msg { border-radius: 8px; font-size: 16px; }
    body.theme-bold .you { border-bottom-right-radius: 8px; }
    body.theme-bold .bot { border-bottom-left-radius: 8px; background: #eeeef6; }
    body.theme-bold input, body.theme-bold button { border-radius: 8px; }

    /* Design: Soft. Tinted background, very round bubbles, centered title. */
    body.theme-soft { background: color-mix(in srgb, var(--accent) 8%, #fff); }
    body.theme-soft header { justify-content: center; border-bottom: 0; padding: 18px; font-weight: 700; }
    body.theme-soft .msg { border-radius: 24px; padding: 12px 17px; }
    body.theme-soft .you { border-bottom-right-radius: 8px; }
    body.theme-soft .bot { background: #fff; border-bottom-left-radius: 8px; box-shadow: 0 1px 4px rgba(20,20,43,.08); }
    body.theme-soft #form { border-top: 0; }
    body.theme-soft input { background: #fff; border-color: transparent; box-shadow: 0 1px 4px rgba(20,20,43,.1); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips button { padding: 8px 14px; font-size: 14px; font-weight: 600; background: #fff; color: var(--accent); border: 1.5px solid var(--accent); }
    .chips button:hover { filter: none; background: color-mix(in srgb, var(--accent) 10%, #fff); }
    .lead { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
    .lead input { flex: none; }
    .lead p { margin: 0; color: var(--muted); }
    .lead .err { color: #b91c1c; }
    :focus-visible { outline: 3px solid #a5a0f5; outline-offset: 2px; }
  </style>
</head>
<body>
  <header id="title"></header>
  <div id="log"></div>
  <!-- Not a <form>: the embed iframe is sandboxed and browsers block form submits there. -->
  <div id="form">
    <input id="input" placeholder="Type your question..." maxlength="500" autocomplete="off" />
    <button id="send" type="button">Send</button>
  </div>

  <script>
    // Filled in by the server: bot name, greeting, and the signed session token.
    var CONFIG = __CONFIG__;

    var log = document.getElementById("log");
    var form = document.getElementById("form");
    var input = document.getElementById("input");
    var send = document.getElementById("send");
    document.body.className = "theme-" + (["clean", "bold", "soft"].indexOf(CONFIG.theme) >= 0 ? CONFIG.theme : "clean");
    document.getElementById("title").textContent = CONFIG.title || CONFIG.botName;
    if (/^#[0-9a-fA-F]{6}$/.test(CONFIG.color || "")) {
      document.documentElement.style.setProperty("--accent", CONFIG.color);
    }

    function addMessage(text, cls) {
      var div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    // The greeting is fixed text, so it costs no AI tokens.
    addMessage(CONFIG.greeting, "bot");

    // Suggested questions: buttons under the greeting. A click sends that question.
    var chips = null;
    if (CONFIG.suggestions && CONFIG.suggestions.length) {
      chips = document.createElement("div");
      chips.className = "chips";
      CONFIG.suggestions.forEach(function (q) {
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = q;
        b.addEventListener("click", function () {
          input.value = q;
          sendMessage();
        });
        chips.appendChild(b);
      });
      log.appendChild(chips);
    }

    var lastQuestion = "";
    var leadShown = false;

    // Shown when the bot couldn't help: the visitor can leave contact details.
    function showLeadForm() {
      if (leadShown) return;
      leadShown = true;
      var box = document.createElement("div");
      box.className = "lead";
      var text = document.createElement("p");
      text.textContent = "Leave your email or phone and " + CONFIG.botName + " will get back to you.";
      var contact = document.createElement("input");
      contact.placeholder = "Email or phone";
      contact.maxLength = 120;
      var name = document.createElement("input");
      name.placeholder = "Your name (optional)";
      name.maxLength = 80;
      var err = document.createElement("p");
      err.className = "err";
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = "Send";
      btn.addEventListener("click", async function () {
        err.textContent = "";
        btn.disabled = true;
        try {
          var res = await fetch("/lead", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: CONFIG.token, contact: contact.value, name: name.value, question: lastQuestion }),
          });
          var info = await res.json().catch(function () { return {}; });
          if (!res.ok) {
            err.textContent = info.error || "Could not send. Please try again.";
            btn.disabled = false;
            return;
          }
          box.textContent = "Thanks! " + CONFIG.botName + " will get back to you.";
        } catch (e) {
          err.textContent = "Could not send. Please try again.";
          btn.disabled = false;
        }
      });
      box.appendChild(text);
      box.appendChild(contact);
      box.appendChild(name);
      box.appendChild(err);
      box.appendChild(btn);
      log.appendChild(box);
      log.scrollTop = log.scrollHeight;
    }

    async function sendMessage() {
      var message = input.value.trim();
      if (!message) return;
      lastQuestion = message;
      if (chips) { chips.remove(); chips = null; }
      input.value = "";
      send.disabled = true;
      addMessage(message, "you");
      var bot = addMessage("", "bot");

      try {
        var res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: message, token: CONFIG.token }),
        });
        if (!res.ok) {
          if (res.status === 429) {
            var info = await res.json().catch(function () { return {}; });
            bot.textContent = info.error || "Too many requests. Please try again later.";
          } else {
            bot.textContent = res.status === 401
              ? "This chat session expired. Please close and reopen the chat."
              : "Sorry, the chat is unavailable right now.";
          }
          return;
        }

        // Read the streamed answer piece by piece.
        var reader = res.body.getReader();
        var decoder = new TextDecoder();
        var buffer = "";
        while (true) {
          var chunk = await reader.read();
          if (chunk.done) break;
          buffer += decoder.decode(chunk.value, { stream: true });
          var events = buffer.split("\n\n");
          buffer = events.pop();
          for (var i = 0; i < events.length; i++) {
            var data = events[i].replace(/^data: /, "");
            if (data === "[DONE]") return;
            var parsed = JSON.parse(data);
            if (parsed.text) bot.textContent += parsed.text;
            if (parsed.lead) showLeadForm();
            if (parsed.error) bot.textContent = parsed.error;
            log.scrollTop = log.scrollHeight;
          }
        }
      } catch (err) {
        bot.textContent = "Sorry, the chat is unavailable right now.";
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    send.addEventListener("click", sendMessage);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        if (!send.disabled) sendMessage();
      }
    });
  </script>
</body>
</html>
